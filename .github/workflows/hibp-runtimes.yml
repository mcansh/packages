name: HIBP runtime contract

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  runtimes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcansh/hibp build
      - run: pnpm --filter @mcansh/hibp typecheck
      - run: node packages/hibp/test/run.ts
      - uses: denoland/setup-deno@v2
        if: matrix.node == 24
        with:
          deno-version: v2.x
      - run: deno run packages/hibp/test/run.ts
        if: matrix.node == 24
      - uses: oven-sh/setup-bun@v2
        if: matrix.node == 24
        with:
          bun-version: latest
      - run: bun packages/hibp/test/run.ts
        if: matrix.node == 24
      - run: node packages/hibp/test/workers.ts
        if: matrix.node == 24
