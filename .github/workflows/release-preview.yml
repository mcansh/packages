name: 🚀 Release (preview)
on:
  push:
    branches:
      - dev
    paths:
      - packages/**
    tags:
      - "!**"
  pull_request:
    branches: [dev]

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.repository == 'mcansh/packages'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: 🟧 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]
              cwd: ./

      - name: 🔐 Setup npm auth
        run: |
          echo "registry=https://registry.npmjs.org" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: 🟧 Set publish-branch to current branch
        run: |
          echo "publish-branch=$(git branch --show-current)" >> ~/.npmrc

      - name: 🏗️ Build
        run: pnpm run build

      - name: 🚀 Publish PR
        run: pnpx pkg-pr-new publish --pnpm './packages/*' --template './apps/url/*' --template './apps/http-helmet/*'
