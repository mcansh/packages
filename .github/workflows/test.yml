name: 🧪 Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        # this is limited to string | boolean | number (https://github.community/t/can-action-inputs-be-arrays/16457)
        # but we want to pass an array (os: "[ubuntu-latest, macos-latest, windows-latest]"),
        # so we'll need to manually stringify it for now
        type: string
      node:
        required: true
        # this is limited to string | boolean | number (https://github.community/t/can-action-inputs-be-arrays/16457)
        # but we want to pass an array (node_version: "[22, 24]"),
        # so we'll need to manually stringify it for now
        type: string
    secrets:
      codecov_token:
        required: true

jobs:
  build:
    name: ⚙️ Build
    runs-on: ubuntu-latest
    outputs:
      engine-node: ${{ steps.package-engines.outputs.node }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: 🟧 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 🟧 Install dependencies
        run: pnpm install --recursive --frozen-lockfile --strict-peer-dependencies

      - name: 🏗 Build
        run: pnpm run build

      - name: 🧮 Typecheck
        run: pnpm run typecheck

      - name: 🧪 Test release scripts
        run: pnpm run test:release

      - name: 📦 Pack packages for engine checks
        id: package-engines
        run: pnpm run test:engines:prepare "$RUNNER_TEMP/package-engines"

      - name: 📤 Upload packed package tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-engine-tests
          path: ${{ runner.temp }}/package-engines
          if-no-files-found: error

  engines:
    name: "Packed packages | ${{ matrix.os }} | node-${{ matrix.node }}"
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(needs.build.outputs.engine-node) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: ⎔ Setup minimum Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: ⬇️ Download packed package tests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-engine-tests
          path: ${{ runner.temp }}/package-engines

      - name: 🟧 Install packed packages with strict engines
        working-directory: ${{ runner.temp }}/package-engines/${{ matrix.node }}
        run: npm install --ignore-scripts --engine-strict --no-audit --no-fund

      - name: 🧪 Test published entry points
        working-directory: ${{ runner.temp }}/package-engines/${{ matrix.node }}
        run: node --test runtime.test.mjs

      - name: 🧪 Test matcher registration
        working-directory: ${{ runner.temp }}/package-engines/${{ matrix.node }}
        run: node node_modules/vitest/vitest.mjs run registration.test.mjs

  test:
    name: "${{ matrix.os }} | node-${{ matrix.node }}"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⎔ Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: 🟧 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 🟧 Install dependencies
        run: pnpm install --recursive --frozen-lockfile --strict-peer-dependencies

      - name: 🧪 Run Tests
        run: pnpm run test:ci

      - name: 📤 Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.codecov_token }}

      - name: 📤 Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.codecov_token }}
          file: "./coverage/test-report.junit.xml"
