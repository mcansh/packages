packages:
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

catalog:
  '@arethetypeswrong/core': ^0.18.5
  '@oxlint/plugins': ^1.87.0
  '@total-typescript/tsconfig': ^1.0.4
  '@types/node': ^24.0.14
  '@vitest/coverage-v8': ^5.0.3
  oxfmt: ^0.72.0
  oxlint: ^1.87.0
  oxlint-tsgolint: ^7.0.2003
  publint: ^0.3.25
  tsdown: ^0.23.0
  type-fest: ^4.41.0
  typescript: ^7.0.2
  vitest: ^5.0.3

overrides:
  '@mcansh/create-temporary-files': workspace:*
  '@mcansh/http-helmet': workspace:*
  '@mcansh/url': workspace:*
