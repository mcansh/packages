packages:
  - packages/*
  - apps/**/*

allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true

catalog:
  '@arethetypeswrong/core': ^0.18.5
  '@total-typescript/tsconfig': ^1.0.4
  '@types/node': ^24.0.14
  '@vitest/coverage-v8': ^4.1.10
  publint: ^0.3.22
  tsdown: ^0.22.14
  type-fest: ^5.8.0
  typescript: ^7.0.2
  vitest: ^4.1.10

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - rolldown
  - sharp
  - unrs-resolver
  - workerd

overrides:
  '@mcansh/create-temporary-files': workspace:*
  '@mcansh/http-helmet': workspace:*
  '@mcansh/url': workspace:*
  '@mcansh/vitest-response-matchers': workspace:*

shellEmulator: true
